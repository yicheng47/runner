name: Preview nightly on push

on:
  push:
    # Preview nightlies are cut from the permanent preview branch, which features in preview merge into.
    # nightly.yml's prepare job reads this list too.
    branches:
      - preview
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch an all-platform preview nightly for the pushed preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nightly.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f channel=preview-nightly -f platform=all
