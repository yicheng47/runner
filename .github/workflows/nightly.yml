name: Nightly
run-name: Nightly (${{ inputs.platform }})

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build from one stamp and commit
        type: choice
        default: both
        options:
          - both
          - macos
          - windows

permissions:
  actions: read
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.build.outputs.stamp }}
      sha: ${{ steps.build.outputs.sha }}
      short_sha: ${{ steps.build.outputs.short_sha }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Check out dispatch commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Compute nightly identity once
        id: build
        run: |
          stamp=$(date -u +%Y%m%d.%H%M)
          sha=$(git rev-parse HEAD)
          test "$sha" = "$GITHUB_SHA"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "version=nightly.${sha:0:7}.$stamp" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: prepare
    if: inputs.platform == 'both' || inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out dispatch commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Require Sparkle signing key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY" || { echo "error: SPARKLE_ED_PRIVATE_KEY is not configured" >&2; exit 1; }
          public_key=$(tr -d '[:space:]' < packaging/sparkle-public-key)
          test "$public_key" != "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" || { echo "error: packaging/sparkle-public-key is still the placeholder" >&2; exit 1; }

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          cache-on-failure: true

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain_password=$(openssl rand -base64 32)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" build.keychain

      - name: Select signing identity
        run: |
          cert_info=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          cert_id=$(printf '%s\n' "$cert_info" | awk -F'"' '{print $2}')
          test -n "$cert_id"
          echo "APPLE_SIGNING_IDENTITY=$cert_id" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple nightly
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RUNNER_BUILD_STAMP: ${{ needs.prepare.outputs.stamp }}
          RUNNER_BUILD_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: ./script/bundle-mac --channel nightly

      - name: Fetch pinned Sparkle tools
        run: |
          sparkle_version=2.9.5
          sparkle_sha256=015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc
          sparkle_archive="$RUNNER_TEMP/Sparkle-$sparkle_version.tar.xz"
          sparkle_dir="$RUNNER_TEMP/Sparkle-$sparkle_version"
          curl --fail --location "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-$sparkle_version.tar.xz" --output "$sparkle_archive"
          printf '%s  %s\n' "$sparkle_sha256" "$sparkle_archive" | shasum -a 256 -c -
          mkdir -p "$sparkle_dir"
          tar -xf "$sparkle_archive" -C "$sparkle_dir"
          echo "SPARKLE_TOOLS_DIR=$sparkle_dir/bin" >> "$GITHUB_ENV"

      - name: Generate signed nightly appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          appcast_dir=$(mktemp -d "$RUNNER_TEMP/runner-nightly-appcast.XXXXXX")
          dmg="target/release/Runner-Nightly-${{ needs.prepare.outputs.short_sha }}.${{ needs.prepare.outputs.stamp }}-arm64.dmg"
          release_url="https://github.com/yicheng47/runner/releases/tag/nightly"
          cp "$dmg" "$appcast_dir/"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SPARKLE_TOOLS_DIR/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/yicheng47/runner/releases/download/nightly/" \
            --full-release-notes-url "$release_url" \
            --link "$release_url" \
            --maximum-versions 10 \
            "$appcast_dir"
          grep -Fq '<sparkle:hardwareRequirements>arm64</sparkle:hardwareRequirements>' "$appcast_dir/appcast.xml"
          echo "APPCAST_DIR=$appcast_dir" >> "$GITHUB_ENV"

      - name: Upload macOS nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-macos
          path: |
            ${{ env.APPCAST_DIR }}/Runner-Nightly-${{ needs.prepare.outputs.short_sha }}.${{ needs.prepare.outputs.stamp }}-arm64.dmg
            ${{ env.APPCAST_DIR }}/appcast.xml
          if-no-files-found: error

  build-windows:
    needs: prepare
    if: inputs.platform == 'both' || inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out dispatch commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Require Windows signing keys
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "error: TAURI_SIGNING_PRIVATE_KEY is not configured" >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "error: TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured" >&2; exit 1; }

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          cache-on-failure: true

      - name: Build Windows installer
        shell: pwsh
        env:
          RUNNER_BUILD_STAMP: ${{ needs.prepare.outputs.stamp }}
          RUNNER_BUILD_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: ./script/bundle-windows.ps1

      - name: Verify installer upgrade and uninstall behavior
        shell: pwsh
        run: ./script/windows/test-installer.ps1 -SourceDir target/x86_64-pc-windows-msvc/release

      - name: Sign Windows installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          installer="target/x86_64-pc-windows-msvc/release/Runner-Setup-${{ needs.prepare.outputs.version }}-x64.exe"
          npx --yes @tauri-apps/cli@2.10.1 signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$installer"
          sig="$installer.sig"
          expected=23fee1fa29746d59
          actual=$(base64 --decode < "$sig" | sed -n 2p | base64 --decode | xxd -p -s2 -l8)
          test "$expected" = "$actual" || { echo "error: installer signed with key $actual; Windows clients trust $expected" >&2; exit 1; }

      - name: Upload Windows nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-windows
          path: |
            target/x86_64-pc-windows-msvc/release/Runner-Setup-${{ needs.prepare.outputs.version }}-x64.exe
            target/x86_64-pc-windows-msvc/release/Runner-Setup-${{ needs.prepare.outputs.version }}-x64.exe.sig
          if-no-files-found: error

  publish:
    needs: [prepare, build-macos, build-windows]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
      ((inputs.platform == 'both' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success') ||
      (inputs.platform == 'macos' && needs.build-macos.result == 'success' && needs.build-windows.result == 'skipped') ||
      (inputs.platform == 'windows' && needs.build-macos.result == 'skipped' && needs.build-windows.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM: ${{ inputs.platform }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      BUILD_STAMP: ${{ needs.prepare.outputs.stamp }}
      NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
      NIGHTLY_SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      DMG_NAME: Runner-Nightly-${{ needs.prepare.outputs.short_sha }}.${{ needs.prepare.outputs.stamp }}-arm64.dmg
      SETUP_NAME: Runner-Setup-${{ needs.prepare.outputs.version }}-x64.exe
    steps:
      - name: Check out dispatch commit with history
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Download macOS nightly artifacts
        if: inputs.platform == 'both' || inputs.platform == 'macos'
        uses: actions/download-artifact@v4
        with:
          name: nightly-macos
          path: nightly-artifacts/macos

      - name: Download Windows nightly artifacts
        if: inputs.platform == 'both' || inputs.platform == 'windows'
        uses: actions/download-artifact@v4
        with:
          name: nightly-windows
          path: nightly-artifacts/windows

      - name: Validate selected artifacts before publishing
        run: |
          if [[ "$PLATFORM" != "windows" ]]; then
            test -s "nightly-artifacts/macos/$DMG_NAME"
            python3 script/verify-nightly-appcast.py nightly-artifacts/macos/appcast.xml "nightly-artifacts/macos/$DMG_NAME" "$NIGHTLY_SHORT_SHA" "$BUILD_STAMP"
          fi
          if [[ "$PLATFORM" != "macos" ]]; then
            test -s "nightly-artifacts/windows/$SETUP_NAME"
            test -s "nightly-artifacts/windows/$SETUP_NAME.sig"
          fi

      - name: Require CI green for this commit
        run: |
          ci_run_id=""
          for _ in {1..60}; do
            ci_run_id=$(gh run list --commit "$SOURCE_SHA" --workflow ci.yaml --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [[ -n "$ci_run_id" ]]; then
              break
            fi
            sleep 10
          done
          test -n "$ci_run_id" || { echo "error: no CI run found for $SOURCE_SHA" >&2; exit 1; }
          gh run watch "$ci_run_id" --exit-status
          gh run view "$ci_run_id" --json headSha,conclusion | jq -e --arg sha "$SOURCE_SHA" '.headSha == $sha and .conclusion == "success"'

      - name: Move the nightly tag to the built commit and compose release notes
        run: |
          notes="$RUNNER_TEMP/nightly-notes.md"
          release=$(git describe --tags --match 'v*' --abbrev=0 "$SOURCE_SHA" 2>/dev/null || true)
          {
            if [[ -z "$release" ]]; then
              echo "## Changes in this nightly"
              echo
              echo "No official release tag is reachable from ${SOURCE_SHA:0:7}."
            else
              echo "## Changes since $release"
              echo
              echo "This nightly is ${SOURCE_SHA:0:7}."
              echo
              git log --no-merges --format='- %s (%h)' "$release..$SOURCE_SHA" > "$RUNNER_TEMP/nightly-changes.txt"
              total=$(wc -l < "$RUNNER_TEMP/nightly-changes.txt")
              if (( total == 0 )); then
                echo "No commits since $release."
              fi
              head -n 100 "$RUNNER_TEMP/nightly-changes.txt"
              if (( total > 100 )); then
                echo "- and $((total - 100)) more commits"
              fi
            fi
            echo
            cat script/nightly-release-notes.md
          } > "$notes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force --annotate nightly --message "Runner Nightly $NIGHTLY_VERSION" "$SOURCE_SHA"
          git push --force origin refs/tags/nightly

      - name: Prepare the rolling nightly prerelease
        run: |
          notes="$RUNNER_TEMP/nightly-notes.md"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --target "$SOURCE_SHA" --title "Runner Nightly" --notes-file "$notes" --prerelease --draft=false --latest=false
          else
            gh release create nightly --target "$SOURCE_SHA" --title "Runner Nightly" --notes-file "$notes" --prerelease --latest=false
          fi

      - name: Publish macOS nightly assets
        if: inputs.platform == 'both' || inputs.platform == 'macos'
        run: |
          gh release upload nightly "nightly-artifacts/macos/$DMG_NAME" --clobber
          gh release upload nightly nightly-artifacts/macos/appcast.xml --clobber

      - name: Publish Windows nightly assets
        if: inputs.platform == 'both' || inputs.platform == 'windows'
        run: |
          gh release upload nightly "nightly-artifacts/windows/$SETUP_NAME" --clobber
          gh release upload nightly "nightly-artifacts/windows/$SETUP_NAME.sig" --clobber

      - name: Verify the public nightly release and downloads before pruning
        run: |
          gh release view nightly --json isPrerelease,isDraft,assets | jq -e --arg platform "$PLATFORM" --arg dmg "$DMG_NAME" --arg setup "$SETUP_NAME" '
            .isPrerelease and (.isDraft | not) and
            ([.assets[].name] |
              ($platform == "windows" or (index($dmg) != null and index("appcast.xml") != null)) and
              ($platform == "macos" or (index($setup) != null and index($setup + ".sig") != null)))'
          if [[ "$PLATFORM" != "windows" ]]; then
            curl --silent --show-error --fail --head --location "https://github.com/yicheng47/runner/releases/download/nightly/$DMG_NAME" >/dev/null
            curl --silent --show-error --fail --location "https://github.com/yicheng47/runner/releases/download/nightly/appcast.xml" --output "$RUNNER_TEMP/public-appcast.xml"
            cmp nightly-artifacts/macos/appcast.xml "$RUNNER_TEMP/public-appcast.xml"
          fi
          if [[ "$PLATFORM" != "macos" ]]; then
            curl --silent --show-error --fail --head --location "https://github.com/yicheng47/runner/releases/download/nightly/$SETUP_NAME" >/dev/null
            curl --silent --show-error --fail --location "https://github.com/yicheng47/runner/releases/download/nightly/$SETUP_NAME.sig" --output "$RUNNER_TEMP/public-installer.sig"
            cmp "nightly-artifacts/windows/$SETUP_NAME.sig" "$RUNNER_TEMP/public-installer.sig"
          fi

      - name: Prune macOS nightlies to two builds
        if: inputs.platform == 'both' || inputs.platform == 'macos'
        run: |
          assets=$(gh release view nightly --json assets --jq '.assets[].name')
          pattern='^Runner-Nightly-.*\.([0-9]{8})\.([0-9]{4})-(arm64|universal)\.dmg$'
          stale=$(printf '%s\n' "$assets" | while IFS= read -r name; do
            if [[ "$name" =~ $pattern ]]; then
              printf '%s.%s\t%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "$name"
            fi
          done | sort -r | sed -n '3,$p' | cut -f2-)
          if printf '%s\n' "$stale" | grep -Fxq "$DMG_NAME"; then
            echo "error: refusing to prune the DMG referenced by the appcast" >&2
            exit 1
          fi
          while IFS= read -r name; do
            [[ -z "$name" ]] || gh release delete-asset nightly "$name" --yes
          done <<< "$stale"

      - name: Prune Windows nightlies to two builds
        if: inputs.platform == 'both' || inputs.platform == 'windows'
        run: |
          assets=$(gh release view nightly --json assets --jq '.assets[].name')
          pattern='^Runner-Setup-.*\.([0-9]{8})\.([0-9]{4})-x64\.exe$'
          stale=$(printf '%s\n' "$assets" | while IFS= read -r name; do
            if [[ "$name" =~ $pattern ]]; then
              printf '%s.%s\t%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "$name"
            fi
          done | sort -r | sed -n '3,$p' | cut -f2-)
          if printf '%s\n' "$stale" | grep -Fxq "$SETUP_NAME"; then
            echo "error: refusing to prune the new Windows installer" >&2
            exit 1
          fi
          while IFS= read -r name; do
            if [[ -n "$name" ]]; then
              gh release delete-asset nightly "$name" --yes
              if printf '%s\n' "$assets" | grep -Fxq "$name.sig"; then
                gh release delete-asset nightly "$name.sig" --yes
              fi
            fi
          done <<< "$stale"

      - name: Report completed nightly publication
        run: |
          echo "Published $PLATFORM nightly $NIGHTLY_VERSION from $SOURCE_SHA to release nightly." >> "$GITHUB_STEP_SUMMARY"

      - name: Report incomplete nightly publication
        if: failure() || cancelled()
        run: |
          echo "Incomplete $PLATFORM nightly $NIGHTLY_VERSION from $SOURCE_SHA. Some files may already be uploaded; inspect release nightly before another cut." >> "$GITHUB_STEP_SUMMARY"
