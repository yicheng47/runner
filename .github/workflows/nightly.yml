name: Nightly
run-name: Nightly (${{ inputs.platform }})

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: macos
        options:
          - macos
          - windows

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ inputs.platform == 'windows' && 'nightly-windows' || 'nightly' }}
  cancel-in-progress: true

jobs:
  build-macos:
    if: inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compute build identity once
        id: build
        run: &build-identity |
          stamp=$(date -u +%Y%m%d.%H%M)
          sha=$(git rev-parse --short=7 HEAD)
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "runner-app") | .version')
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_version=$version.$stamp" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          cache-on-failure: true

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain_password=$(openssl rand -base64 32)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" build.keychain

      - name: Select signing identity
        run: |
          cert_info=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          cert_id=$(printf '%s\n' "$cert_info" | awk -F'"' '{print $2}')
          test -n "$cert_id"
          echo "APPLE_SIGNING_IDENTITY=$cert_id" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple nightly
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RUNNER_BUILD_STAMP: ${{ steps.build.outputs.stamp }}
          RUNNER_BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: ./script/bundle-mac --channel nightly

      - name: Require CI green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_run_id=""
          for _ in {1..60}; do
            ci_run_id=$(gh run list --commit "$GITHUB_SHA" --workflow ci.yaml --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [[ -n "$ci_run_id" ]]; then
              break
            fi
            sleep 10
          done
          test -n "$ci_run_id" || { echo "error: no CI run found for $GITHUB_SHA" >&2; exit 1; }
          gh run watch "$ci_run_id" --exit-status

      - name: Publish the rolling draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new_dmg="target/release/Runner-Nightly-${{ steps.build.outputs.short_version }}-arm64.dmg"
          notes="Rolling draft for the nightly channel. Hidden from the public releases page; fetch with: gh release download nightly"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "Runner Nightly" --notes "$notes" --draft
          else
            gh release create nightly --target main --title "Runner Nightly" --notes "$notes" --draft
          fi
          gh release upload nightly "$new_dmg" --clobber
          gh release view nightly --json assets --jq '.assets[].name' | while IFS= read -r name; do
            if [[ "$name" =~ ([0-9]{8})\.([0-9]{4})-(arm64|universal)\.dmg$ ]]; then
              printf '%s.%s\t%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "$name"
            fi
          done | sort -r | sed -n '11,$p' | cut -f2- | while IFS= read -r stale; do
            gh release delete-asset nightly "$stale" --yes
          done
          echo "NEW_DMG_NAME=${new_dmg##*/}" >> "$GITHUB_ENV"

      - name: Verify the nightly release stays hidden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_draft=$(gh release view nightly --json isDraft --jq .isDraft)
          test "$is_draft" = "true" || { echo "error: nightly release is published; it must stay a draft" >&2; exit 1; }
          if curl --silent --fail --head --location "https://github.com/yicheng47/runner/releases/download/nightly/$NEW_DMG_NAME" >/dev/null; then
            echo "error: nightly assets are publicly reachable without authentication" >&2
            exit 1
          fi

  nightly-windows:
    if: inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require Windows signing keys
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "error: TAURI_SIGNING_PRIVATE_KEY is not configured" >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "error: TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured" >&2; exit 1; }

      - name: Compute build identity once
        id: build
        run: *build-identity

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          cache-on-failure: true

      - name: Build Windows installer
        shell: pwsh
        env:
          RUNNER_BUILD_STAMP: ${{ steps.build.outputs.stamp }}
          RUNNER_BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: ./script/bundle-windows.ps1

      - name: Verify installer upgrade and uninstall behavior
        shell: pwsh
        run: ./script/windows/test-installer.ps1 -SourceDir target/x86_64-pc-windows-msvc/release

      - name: Sign Windows installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          installer="target/x86_64-pc-windows-msvc/release/Runner-Setup-${{ steps.build.outputs.short_version }}-x64.exe"
          npx --yes @tauri-apps/cli@2.10.1 signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$installer"
          sig="$installer.sig"
          expected=23fee1fa29746d59
          actual=$(base64 --decode < "$sig" | sed -n 2p | base64 --decode | xxd -p -s2 -l8)
          test "$expected" = "$actual" || { echo "error: installer signed with key $actual; Windows clients trust $expected" >&2; exit 1; }

      - name: Require CI green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_run_id=""
          for _ in {1..60}; do
            ci_run_id=$(gh run list --commit "$GITHUB_SHA" --workflow ci.yaml --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [[ -n "$ci_run_id" ]]; then
              break
            fi
            sleep 10
          done
          test -n "$ci_run_id" || { echo "error: no CI run found for $GITHUB_SHA" >&2; exit 1; }
          gh run watch "$ci_run_id" --exit-status

      - name: Publish the rolling Windows prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new_setup="target/x86_64-pc-windows-msvc/release/Runner-Setup-${{ steps.build.outputs.short_version }}-x64.exe"
          notes="script/windows/release-notes.md"
          if gh release view nightly-win >/dev/null 2>&1; then
            gh release edit nightly-win --title "Runner Nightly (Windows)" --notes-file "$notes" --prerelease --draft=false
          else
            gh release create nightly-win --target main --prerelease --title "Runner Nightly (Windows)" --notes-file "$notes"
          fi
          gh release upload nightly-win "$new_setup" "$new_setup.sig" --clobber
          pattern='^Runner-Setup-.*\.([0-9]{8})\.([0-9]{4})-x64\.exe$'
          assets=$(gh release view nightly-win --json assets --jq '.assets[].name')
          printf '%s\n' "$assets" | while IFS= read -r name; do
            if [[ "$name" =~ $pattern ]]; then
              printf '%s.%s\t%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "$name"
            fi
          done | sort -r | sed -n '11,$p' | cut -f2- | while IFS= read -r stale; do
            gh release delete-asset nightly-win "$stale" --yes
            if printf '%s\n' "$assets" | grep -Fxq "$stale.sig"; then
              gh release delete-asset nightly-win "$stale.sig" --yes
            fi
          done
          echo "NEW_SETUP_NAME=${new_setup##*/}" >> "$GITHUB_ENV"

      - name: Verify the Windows prerelease is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_prerelease=$(gh release view nightly-win --json isPrerelease --jq .isPrerelease)
          is_draft=$(gh release view nightly-win --json isDraft --jq .isDraft)
          test "$is_prerelease" = "true" || { echo "error: Windows nightly must be a prerelease" >&2; exit 1; }
          test "$is_draft" = "false" || { echo "error: Windows nightly must be published" >&2; exit 1; }
          curl --silent --fail --head --location "https://github.com/yicheng47/runner/releases/download/nightly-win/$NEW_SETUP_NAME" >/dev/null
