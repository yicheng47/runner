name: Nightly

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: macos
        options:
          - macos
          - windows

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ inputs.platform == 'windows' && 'nightly-windows' || 'nightly' }}
  cancel-in-progress: true

jobs:
  build-macos:
    if: inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compute build identity once
        id: build
        run: &build-identity |
          stamp=$(date -u +%Y%m%d.%H%M)
          sha=$(git rev-parse --short=7 HEAD)
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "runner-app") | .version')
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_version=$version.$stamp" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain_password=$(openssl rand -base64 32)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" build.keychain

      - name: Select signing identity
        run: |
          cert_info=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          cert_id=$(printf '%s\n' "$cert_info" | awk -F'"' '{print $2}')
          test -n "$cert_id"
          echo "APPLE_SIGNING_IDENTITY=$cert_id" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple nightly
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RUNNER_BUILD_STAMP: ${{ steps.build.outputs.stamp }}
          RUNNER_BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: ./script/bundle-mac --channel nightly

      - name: Require CI green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_run_id=""
          for _ in {1..60}; do
            ci_run_id=$(gh run list --commit "$GITHUB_SHA" --workflow ci.yaml --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [[ -n "$ci_run_id" ]]; then
              break
            fi
            sleep 10
          done
          test -n "$ci_run_id" || { echo "error: no CI run found for $GITHUB_SHA" >&2; exit 1; }
          gh run watch "$ci_run_id" --exit-status

      - name: Publish the rolling draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new_dmg="target/release/Runner-Nightly-${{ steps.build.outputs.short_version }}-arm64.dmg"
          notes="Rolling draft for the nightly channel. Hidden from the public releases page; fetch with: gh release download nightly"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "Runner Nightly" --notes "$notes" --draft
          else
            gh release create nightly --target main --title "Runner Nightly" --notes "$notes" --draft
          fi
          gh release upload nightly "$new_dmg" --clobber
          gh release view nightly --json assets --jq '.assets[].name' | while IFS= read -r name; do
            if [[ "$name" =~ ([0-9]{8})\.([0-9]{4})-(arm64|universal)\.dmg$ ]]; then
              printf '%s.%s\t%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "$name"
            fi
          done | sort -r | sed -n '11,$p' | cut -f2- | while IFS= read -r stale; do
            gh release delete-asset nightly "$stale" --yes
          done
          echo "NEW_DMG_NAME=${new_dmg##*/}" >> "$GITHUB_ENV"

      - name: Verify the nightly release stays hidden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_draft=$(gh release view nightly --json isDraft --jq .isDraft)
          test "$is_draft" = "true" || { echo "error: nightly release is published; it must stay a draft" >&2; exit 1; }
          if curl --silent --fail --head --location "https://github.com/yicheng47/runner/releases/download/nightly/$NEW_DMG_NAME" >/dev/null; then
            echo "error: nightly assets are publicly reachable without authentication" >&2
            exit 1
          fi

  nightly-windows:
    if: inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compute build identity once
        id: build
        run: *build-identity

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build Windows nightly
        env:
          RUNNER_BUILD_STAMP: ${{ steps.build.outputs.stamp }}
          RUNNER_BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: cargo build --release -p runner-app -p runner-cli --target x86_64-pc-windows-msvc

      - name: Stage and zip Windows nightly
        shell: pwsh
        run: |
          $release = "target/x86_64-pc-windows-msvc/release"
          $name = "Runner-Nightly-${{ steps.build.outputs.short_version }}-x64"
          $stage = New-Item -ItemType Directory -Path "$release/$name"
          Copy-Item "$release/Runner.exe", "$release/runner-agent-cli.exe", "$release/runner-mcp.exe" -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "$release/$name.zip"

      - name: Require CI green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_run_id=""
          for _ in {1..60}; do
            ci_run_id=$(gh run list --commit "$GITHUB_SHA" --workflow ci.yaml --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [[ -n "$ci_run_id" ]]; then
              break
            fi
            sleep 10
          done
          test -n "$ci_run_id" || { echo "error: no CI run found for $GITHUB_SHA" >&2; exit 1; }
          gh run watch "$ci_run_id" --exit-status

      - name: Publish the rolling Windows prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new_zip="target/x86_64-pc-windows-msvc/release/Runner-Nightly-${{ steps.build.outputs.short_version }}-x64.zip"
          notes="Extract the zip before running Runner.exe so Runner.exe, runner-agent-cli.exe, and runner-mcp.exe stay together. This build is unsigned. If SmartScreen shows Windows protected your PC, choose More info → Run anyway."
          notes+=$'\n\nFor agents, install Git for Windows (Claude Code uses Git Bash, including the runner sh shim), Node.js LTS, and the agent CLIs (@anthropic-ai/claude-code and/or @openai/codex).'
          if gh release view nightly-win >/dev/null 2>&1; then
            gh release edit nightly-win --title "Runner Nightly (Windows)" --notes "$notes" --prerelease --draft=false
          else
            gh release create nightly-win --target nightly-windows --prerelease --title "Runner Nightly (Windows)" --notes "$notes"
          fi
          gh release upload nightly-win "$new_zip" --clobber
          gh release view nightly-win --json assets --jq '.assets[].name' | while IFS= read -r name; do
            if [[ "$name" =~ ([0-9]{8})\.([0-9]{4})-x64\.zip$ ]]; then
              printf '%s.%s\t%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "$name"
            fi
          done | sort -r | sed -n '11,$p' | cut -f2- | while IFS= read -r stale; do
            gh release delete-asset nightly-win "$stale" --yes
          done
          echo "NEW_ZIP_NAME=${new_zip##*/}" >> "$GITHUB_ENV"

      - name: Verify the Windows prerelease is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_prerelease=$(gh release view nightly-win --json isPrerelease --jq .isPrerelease)
          is_draft=$(gh release view nightly-win --json isDraft --jq .isDraft)
          test "$is_prerelease" = "true" || { echo "error: Windows nightly must be a prerelease" >&2; exit 1; }
          test "$is_draft" = "false" || { echo "error: Windows nightly must be published" >&2; exit 1; }
          curl --silent --fail --head --location "https://github.com/yicheng47/runner/releases/download/nightly-win/$NEW_ZIP_NAME" >/dev/null
