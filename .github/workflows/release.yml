name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Create an inspectable draft without a Git tag
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify version and compute release identity once
        id: release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          stamp=$(date -u +%Y%m%d.%H%M)
          sha=$(git rev-parse --short=7 HEAD)
          workspace_version=$(./script/bundle-mac --print-version)
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version=${GITHUB_REF_NAME#v}
            test "$GITHUB_REF_NAME" != "$version" || { echo "error: release tag must start with v: $GITHUB_REF_NAME" >&2; exit 1; }
            test "$workspace_version" = "$version" || { echo "error: tag $GITHUB_REF_NAME does not match workspace version $workspace_version" >&2; exit 1; }
            release_tag=$GITHUB_REF_NAME
            release_title="Runner $version"
          else
            test "$DRY_RUN" = "true" || { echo "error: workflow_dispatch is only supported with dry_run enabled" >&2; exit 1; }
            version=${workspace_version%-nightly}
            release_tag="dry-run-$stamp"
            release_title=$release_tag
          fi
          case "$version" in
            0.6.0) bridge_mode=build ;;
            0.6.*) bridge_mode=carry ;;
            *) bridge_mode=none ;;
          esac
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_title=$release_title" >> "$GITHUB_OUTPUT"
          echo "bridge_mode=$bridge_mode" >> "$GITHUB_OUTPUT"

      - name: Require release signing keys
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY" || { echo "error: SPARKLE_ED_PRIVATE_KEY is not configured" >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "error: TAURI_SIGNING_PRIVATE_KEY is not configured" >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "error: TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured" >&2; exit 1; }
          public_key=$(tr -d '[:space:]' < packaging/sparkle-public-key)
          test "$public_key" != "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" || { echo "error: packaging/sparkle-public-key is still the placeholder" >&2; exit 1; }

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain_password=$(openssl rand -base64 32)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" build.keychain

      - name: Select signing identity
        run: |
          cert_info=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          cert_id=$(printf '%s\n' "$cert_info" | awk -F'"' '{print $2}')
          test -n "$cert_id"
          echo "APPLE_SIGNING_IDENTITY=$cert_id" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple production release
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RUNNER_BUILD_STAMP: ${{ steps.release.outputs.stamp }}
          RUNNER_BUILD_SHA: ${{ steps.release.outputs.sha }}
        run: ./script/bundle-mac --channel production

      - name: Fetch pinned Sparkle tools
        run: |
          sparkle_version=2.9.5
          sparkle_sha256=015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc
          sparkle_archive="$RUNNER_TEMP/Sparkle-$sparkle_version.tar.xz"
          sparkle_dir="$RUNNER_TEMP/Sparkle-$sparkle_version"
          curl --fail --location "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-$sparkle_version.tar.xz" --output "$sparkle_archive"
          printf '%s  %s\n' "$sparkle_sha256" "$sparkle_archive" | shasum -a 256 -c -
          mkdir -p "$sparkle_dir"
          tar -xf "$sparkle_archive" -C "$sparkle_dir"
          echo "SPARKLE_TOOLS_DIR=$sparkle_dir/bin" >> "$GITHUB_ENV"

      - name: Generate signed production appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          appcast_dir=$(mktemp -d "$RUNNER_TEMP/runner-release-appcast.XXXXXX")
          dmg="target/release/Runner-${{ steps.release.outputs.version }}-arm64.dmg"
          release_url="https://github.com/yicheng47/runner/releases/tag/${{ steps.release.outputs.release_tag }}"
          cp "$dmg" "$appcast_dir/"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SPARKLE_TOOLS_DIR/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/yicheng47/runner/releases/download/${{ steps.release.outputs.release_tag }}/" \
            --full-release-notes-url "$release_url" \
            --link "$release_url" \
            --maximum-versions 10 \
            "$appcast_dir"
          grep -Fq '<sparkle:hardwareRequirements>arm64</sparkle:hardwareRequirements>' "$appcast_dir/appcast.xml"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
          echo "APPCAST=$appcast_dir/appcast.xml" >> "$GITHUB_ENV"

      - name: Build and sign the v0.6.0 Tauri bridge
        if: steps.release.outputs.bridge_mode == 'build'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          tar czf target/release/Runner.app.tar.gz -C target/release Runner.app
          (
            cd target/release
            npx --yes @tauri-apps/cli@2.10.1 signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" Runner.app.tar.gz
          )
          expected=23fee1fa29746d59
          actual=$(base64 --decode < target/release/Runner.app.tar.gz.sig | sed -n 2p | base64 --decode | xxd -p -s2 -l8)
          test "$expected" = "$actual" || { echo "error: bridge signed with key $actual; 0.5.x clients trust $expected" >&2; exit 1; }

      - name: Generate the v0.6.0 Tauri updater manifest
        if: steps.release.outputs.bridge_mode == 'build'
        run: |
          bridge_url="https://github.com/yicheng47/runner/releases/download/v0.6.0/Runner.app.tar.gz"
          bridge_release_url="https://github.com/yicheng47/runner/releases/tag/v0.6.0"
          pub_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg version "0.6.0" \
            --arg pub_date "$pub_date" \
            --arg notes "See $bridge_release_url" \
            --arg url "$bridge_url" \
            --rawfile signature target/release/Runner.app.tar.gz.sig \
            '{version: $version, pub_date: $pub_date, notes: $notes, platforms: {"darwin-aarch64": {url: $url, signature: $signature}, "darwin-x86_64": {url: $url, signature: $signature}}}' \
            > target/release/latest.json

      - name: Carry the v0.6.0 Tauri updater manifest through 0.6.x
        if: steps.release.outputs.bridge_mode == 'carry'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.6.0 --pattern latest.json --dir target/release

      - name: Require CI green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_run_id=""
          for _ in {1..60}; do
            ci_run_id=$(gh run list --commit "$GITHUB_SHA" --workflow ci.yaml --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [[ -n "$ci_run_id" ]]; then
              break
            fi
            sleep 10
          done
          test -n "$ci_run_id" || { echo "error: no CI run found for $GITHUB_SHA" >&2; exit 1; }
          gh run watch "$ci_run_id" --exit-status

      - name: Create draft release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${{ steps.release.outputs.release_tag }}"
          release_title="${{ steps.release.outputs.release_title }}"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            gh release create "$release_tag" --draft --verify-tag --title "$release_title" --notes "See https://github.com/yicheng47/runner/commits/$release_tag"
          else
            gh release create "$release_tag" --draft --prerelease --title "$release_title" --notes "Dry-run artifacts for commit $GITHUB_SHA. Delete this draft after inspection."
          fi
          artifacts=("$DMG" "$APPCAST")
          if [[ "${{ steps.release.outputs.bridge_mode }}" == "build" ]]; then
            artifacts+=(target/release/Runner.app.tar.gz target/release/Runner.app.tar.gz.sig target/release/latest.json)
          elif [[ "${{ steps.release.outputs.bridge_mode }}" == "carry" ]]; then
            artifacts+=(target/release/latest.json)
          fi
          gh release upload "$release_tag" "${artifacts[@]}" --clobber
