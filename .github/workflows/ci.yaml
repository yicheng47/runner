name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / macOS
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Install nextest
        run: curl -LsSf https://get.nexte.st/0.9.148/mac | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Hash build settings
        id: cache-key
        shell: bash
        run: echo "hash=$({ grep -v '^version = ' Cargo.toml; cat rust-toolchain.toml; } | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.cache-key.outputs.hash }}
          add-rust-environment-hash-key: false
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --profile ci -- -D warnings

      - name: Clippy with updater
        run: cargo clippy --locked -p runner-app --features updater --all-targets --profile ci -- -D warnings

      - name: Test
        run: cargo nextest run --locked --workspace --no-fail-fast --cargo-profile ci --timings

      - name: Check generated CLI reference
        run: |
          cargo build --locked -p runner-cli --profile ci
          python3 script/generate-cli-reference.py --runner target/ci/runner-agent-cli --check

      - name: Verify lockfile is committed
        run: git diff --exit-code -- Cargo.lock

      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-macos
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  rust-windows:
    name: Rust / Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Install nextest
        shell: bash
        run: curl -LsSf https://get.nexte.st/0.9.148/windows-tar | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Hash build settings
        id: cache-key
        shell: bash
        run: echo "hash=$({ grep -v '^version = ' Cargo.toml; cat rust-toolchain.toml; } | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.cache-key.outputs.hash }}
          add-rust-environment-hash-key: false
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify Windows installer behavior
        run: ./script/windows/test-installer.ps1

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --profile ci -- -D warnings

      - name: Test
        run: cargo nextest run --locked --workspace --no-fail-fast --cargo-profile ci --timings

      - name: Build Runner for resource verification
        run: cargo build --locked -p runner-app --profile ci --timings

      - name: Verify Runner manifest and icon
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Resources {
            [DllImport("kernel32", CharSet = CharSet.Unicode)] public static extern IntPtr LoadLibraryEx(string path, IntPtr file, uint flags);
            [DllImport("kernel32")] public static extern bool FreeLibrary(IntPtr module);
            [DllImport("kernel32", CharSet = CharSet.Unicode)] static extern IntPtr FindResource(IntPtr module, IntPtr id, IntPtr type);
            [DllImport("kernel32")] static extern IntPtr LoadResource(IntPtr module, IntPtr resource);
            [DllImport("kernel32")] static extern IntPtr LockResource(IntPtr resource);
            [DllImport("kernel32")] static extern uint SizeofResource(IntPtr module, IntPtr resource);
            public static byte[] Read(IntPtr module, int type, int id) {
              var resource = FindResource(module, (IntPtr)id, (IntPtr)type);
              if (resource == IntPtr.Zero) throw new Exception($"Missing resource {type}/{id}");
              var bytes = new byte[SizeofResource(module, resource)];
              Marshal.Copy(LockResource(LoadResource(module, resource)), bytes, 0, bytes.Length); return bytes;
            }
          }
          '@
          $module = [Resources]::LoadLibraryEx((Resolve-Path target/ci/Runner.exe), [IntPtr]::Zero, 2)
          if ($module -eq [IntPtr]::Zero) { throw 'Cannot load Runner.exe resources' }
          try {
            $manifest = [Text.Encoding]::UTF8.GetString([Resources]::Read($module, 24, 1))
            if ($manifest -notmatch '>PerMonitorV2<' -or $manifest -notmatch '<longPathAware[^>]*>true</longPathAware>') { throw 'Runner manifest lacks DPI or long-path awareness' }
            Write-Host 'Runner.exe RT_MANIFEST #1: PerMonitorV2; longPathAware=true'
            $group = [Resources]::Read($module, 14, 1); $ico = [IO.File]::ReadAllBytes("$pwd/assets/icon.ico")
            if ([BitConverter]::ToUInt16($group, 4) -ne 4 -or [BitConverter]::ToUInt16($ico, 4) -ne 4) { throw 'Expected four Runner icon images' }
            for ($i = 0; $i -lt 4; $i++) { $size = [BitConverter]::ToUInt32($ico, 6 + 16 * $i + 8); $offset = [BitConverter]::ToUInt32($ico, 6 + 16 * $i + 12); $png = [Resources]::Read($module, 3, [BitConverter]::ToUInt16($group, 6 + 14 * $i + 12)); if ([Convert]::ToBase64String($png) -cne [Convert]::ToBase64String($ico, $offset, $size)) { throw "Runner icon image $i differs" } }
            Write-Host 'Runner.exe RT_GROUP_ICON #1: all 4 PNG images match assets/icon.ico (16, 32, 48, 256 px)'
          } finally { [void][Resources]::FreeLibrary($module) }

      - name: Check generated CLI reference
        shell: pwsh
        run: |
          cargo build --locked -p runner-cli --profile ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python script/generate-cli-reference.py --runner target/ci/runner-agent-cli.exe --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify lockfile is committed
        run: git diff --exit-code -- Cargo.lock

      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-windows
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  rust-linux:
    name: Rust / Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            nextest-platform: linux
          - runner: ubuntu-24.04-arm
            arch: aarch64
            nextest-platform: linux-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:22.04
      options: --init
    timeout-minutes: 60
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Bootstrap checkout prerequisites
        run: apt-get update && apt-get install -y ca-certificates git
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: ./script/linux/install-build-deps
      - name: Install Node for embedded pi extension tests
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1 --profile minimal --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install nextest
        shell: bash
        run: curl -LsSf https://get.nexte.st/0.9.148/${{ matrix.nextest-platform }} | tar zxf - -C "$HOME/.cargo/bin"
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-22.04-${{ matrix.arch }}
          cache-on-failure: false
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --profile ci -- -D warnings
      - name: Test
        run: |
          useradd --create-home runner-ci
          chown -R runner-ci:runner-ci "$GITHUB_WORKSPACE" "$HOME/.cargo" "$HOME/.rustup"
          # Later CLI and lockfile checks run as root against this checkout.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          runuser -u runner-ci -- env CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
            cargo nextest run --locked --workspace --no-fail-fast --cargo-profile ci --timings
      - name: Check generated CLI reference
        run: |
          cargo build --locked -p runner-cli --profile ci
          python3 script/generate-cli-reference.py --runner target/ci/runner-agent-cli --check
      - name: Test Linux installer ownership
        run: python3 script/linux/test-packaging.py
      - name: Check Linux desktop entry
        run: desktop-file-validate packaging/linux/runner.desktop
      - name: Verify lockfile is committed
        run: git diff --exit-code -- Cargo.lock
      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-linux-${{ matrix.arch }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7
