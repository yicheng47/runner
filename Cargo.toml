[workspace]
resolver = "2"
members = [
    "crates/runner-backend",
    "crates/runner-core",
    "crates/runner-app",
    "crates/runner-terminal",
    "cli",
]

[workspace.package]
edition = "2021"
authors = ["Jason Wang <yuesihan@gmail.com>"]
license = "GPL-3.0-only"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ulid = "1"
uuid = { version = "1", features = ["v4"] }

# Dev builds are the daily-drive builds (`make run`). Unoptimized taffy/gpui made
# every keystroke relayout the window at ~100ms with a drawer open (profiled
# 2026-08-20); optimizing external deps once brings dev frames near release speed
# while keeping workspace crates at opt-level 0 for fast incremental rebuilds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.gpui-ce]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

# Release binaries ship inside a universal DMG, so every byte counts twice.
# Not stripped: the panic hook logs backtraces, and stripping would turn their
# frames into bare addresses.
[profile.release]
lto = "fat"
codegen-units = 1
