[package]
name = "runner"
version = "0.4.6"
description = "An editor for teams of local coding agents (Claude Code, Codex, and friends)"
edition.workspace = true
authors.workspace = true

[lib]
name = "runner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
runner-core = { path = "../crates/runner-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
# Derived row<->struct mapping for the repo layer (impl 0021). 0.36.x is
# the release whose rusqlite dependency is 0.32, matching the workspace
# rusqlite exactly so the Row types unify.
serde_rusqlite = "0.36"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
chrono = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
uuid = { workspace = true }
# Regular dep (not dev-only) because the sidecar writer needs
# NamedTempFile::persist for a Windows-safe atomic replace.
tempfile = "3"
# Filesystem watcher for the per-mission event-log tail (C7). The
# `macos_fsevent` backend is the default on macOS; on Linux it falls back to
# inotify, on Windows to ReadDirectoryChangesW.
notify = "6"
# MCP server (impl 0013): Unix socket listener for external clients.
# The `runner-mcp` sidecar bridges stdio ↔ this socket.
rmcp = { version = "1.7", features = ["server"] }
schemars = "1"
tokio = { version = "1", features = ["net", "rt", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
# Codex MCP config lives in ~/.codex/config.toml; toml_edit preserves
# user-authored comments + formatting on round-trip writes.
toml_edit = "0.25"

# Unix-only deps:
#  - libc: FIFO mkfifo + poll() inside session::tmux_runtime.
#  - portable-pty: backing crate for session::pty_runtime, the
#    in-process replacement for tmux (impl 0011). Windows keeps the
#    tmux fallback until a named-pipe equivalent lands.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
portable-pty = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
# `NSPasteboard` + `NSPasteboardItem` back the file-path paste (feature 55).
# A file copy puts no text on the clipboard, only `public.file-url` flavors,
# and `DataTransfer` deliberately withholds filesystem paths — so the path can
# only come from the pasteboard itself. objc2 gates every class behind its own
# feature, hence the explicit adds.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSView", "NSWindow", "NSWorkspace"] }
# System-wake observer (impl 0037). `NSWorkspace`'s notification center is
# the only precise sleep/wake signal available to the app — tao never emits
# `Event::Resumed` on macOS. `block2` + `NSOperation` are what the
# `addObserverForName:object:queue:usingBlock:` binding is gated on; both
# crates are already in the lock via tao/wry.
# `NSURL` decodes the pasteboard's percent-encoded `file://` strings into
# POSIX paths (feature 55).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "NSURL", "block2"] }
block2 = "0.6"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# Used by issue #124's forwarder-contention regression test to hold the
# event-log flock from a second fd; matches the version `runner-core`
# pulls in transitively so the trait impl resolves identically.
fs2 = "0.4"
