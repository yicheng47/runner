[package]
name = "runner-app"
version = "0.7.5"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
default-run = "Runner"

[[bin]]
name = "Runner"
path = "src/main.rs"

[features]
updater = []

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
base64 = "0.22"
chrono = { workspace = true }
futures = "0.3"
runner-backend = { path = "../runner-backend" }
runner-terminal = { path = "../runner-terminal" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { package = "gpui-ce", version = "0.3" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSButton", "NSControl", "NSImage", "NSResponder", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSData", "NSDate", "NSDateFormatter", "NSDictionary", "NSError", "NSFormatter", "NSGeometry", "NSString"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# Keep gpui's defaults except windows-manifest; resync when its defaults change.
gpui = { package = "gpui-ce", version = "0.3", default-features = false, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(windows)'.dev-dependencies]
gpui = { package = "gpui-ce", version = "0.3", default-features = false, features = ["test-support"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
font-kit = { package = "zed-font-kit", version = "0.14.1-zed" }
gpui = { package = "gpui-ce", version = "0.3", features = ["test-support"] }
