[package]
name = "runner-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
default-run = "Runner"

[lints]
workspace = true

[[bin]]
name = "Runner"
path = "src/main.rs"

[features]
updater = []

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
base64 = "0.22"
chrono = { workspace = true }
flate2 = "1"
futures = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
runner-core = { path = "../runner-core" }
runner-terminal = { path = "../runner-terminal" }
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3.2"
toml = "0.8.23"
# The bundled grammars: keep this list, `highlight::GRAMMARS` and
# assets/grammars/README.md in step.
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-sequel = "0.3"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit"] }
core-foundation = "0.10"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSButton", "NSControl", "NSEvent", "NSImage", "NSResponder", "NSScreen", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSOperation", "block2", "NSArray", "NSData", "NSDate", "NSDateFormatter", "NSDictionary", "NSBundle", "NSError", "NSFormatter", "NSGeometry", "NSString"] }
objc2-user-notifications = "0.3"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# Keep gpui's defaults except windows-manifest; resync when its defaults change.
gpui = { package = "gpui-pre", version = "=0.3.7", default-features = false, features = ["font-kit", "wayland", "x11"] }
# gpui-pre-platform would re-enable windows-manifest alongside Runner's manifest.
gpui_windows = { package = "gpui-pre-windows", version = "=0.3.7", default-features = false }
windows = { version = "0.62", features = ["UI_Notifications", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7", default-features = false, features = ["test-support"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-text = "21"
font-kit = { package = "zed-font-kit", version = "0.14.1-zed" }
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }

[dev-dependencies]
runner-daemon = { path = "../runner-daemon", features = ["test-support"] }
runner-terminal = { path = "../runner-terminal", features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
flate2 = "1"
tar = "0.4"
semver = "1"
gpui = { package = "gpui-pre", version = "=0.3.7", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", default-features = false, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7", default-features = false, features = ["test-support"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
minisign-verify = "0.2"
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "socks"] }
