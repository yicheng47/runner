[package]
name = "runner-app"
version = "0.3.17"
edition.workspace = true
authors.workspace = true
publish = false
default-run = "runner-app"

[[bin]]
name = "runner-app"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
base64 = "0.22"
chrono = { workspace = true }
futures = "0.3"
gpui = { package = "gpui-ce", version = "0.3" }
runner-backend = { path = "../runner-backend" }
runner-terminal = { path = "../runner-terminal" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["sync"] }
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSButton", "NSControl", "NSImage", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }
raw-window-handle = "0.6"

[dev-dependencies]
tempfile = "3"
