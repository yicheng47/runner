[package]
name = "runner-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Bundled `runner` CLI for operating Runner and participating in mission coordination."
autobins = false

[lib]
name = "runner_cli"
path = "src/lib.rs"

# Source-side agent binary. `cli_install` renames this to `runner` when
# copying into `$APPDATA/runner/bin/`. The GPUI app binary is `Runner`.
[[bin]]
name = "runner-agent-cli"
path = "src/main.rs"

[dependencies]
runner-core = { path = "../runner-core" }
runner-daemon = { path = "../runner-daemon" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
tokio = { version = "1", features = ["macros", "net", "rt", "time", "io-util", "io-std", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading"] }

[dev-dependencies]
regex = "1"
runner-terminal = { path = "../runner-terminal" }
tempfile = "3"
toml_edit = "0.25"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects"] }
