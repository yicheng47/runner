[package]
name = "runner-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Bundled `runner` CLI for operating Runner and participating in mission coordination."
autobins = false

[lib]
name = "runner_cli"
path = "src/lib.rs"

# Source-side agent binary. `cli_install` renames this to `runner` when
# copying into `$APPDATA/runner/bin/`. The GPUI app binary is `Runner`.
[[bin]]
name = "runner-agent-cli"
path = "src/main.rs"

[dependencies]
runner-core = { path = "../runner-core" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
tokio = { version = "1", features = ["macros", "net", "rt", "time", "io-util", "io-std", "signal"] }
rmcp = { version = "1.7", features = ["client"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
rmcp = { version = "1.7", features = ["server"] }
tempfile = "3"
