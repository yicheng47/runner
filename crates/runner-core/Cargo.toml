[package]
name = "runner-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared types and event-log primitives for the Runner app and CLI."

[lib]
name = "runner_core"

[features]
schemars = ["dep:schemars"]

[dependencies]
schemars = { version = "1", optional = true }
chrono = { workspace = true }
fs2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
uuid = { workspace = true }
anyhow = "1"
log = "0.4"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_IO", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
